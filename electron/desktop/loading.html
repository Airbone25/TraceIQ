<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
  <title>TraceIQ</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#17181c; color:#ececec; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
    .brand { font-size:26px; font-weight:700; letter-spacing:.5px; color:#10a37f; }
    .spinner { width:26px; height:26px; border:3px solid rgba(16,163,127,.2); border-top-color:#10a37f; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .sub { color:#6b7280; font-size:13px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="brand">TraceIQ</div>
  <div class="sub">Starting local server…</div>
</body>
</html>
