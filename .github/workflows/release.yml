name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build the unsigned NSIS installer (+ latest.yml + .blockmap) without
      # publishing. Skip code signing so electron-builder does not need the
      # winCodeSign signing toolchain.
      - name: Build Windows installer
        run: npm run desktop:dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify build artifacts
        shell: pwsh
        run: |
          $missing = @()
          if (-not (Test-Path 'release/latest.yml')) { $missing += 'release/latest.yml' }
          if (-not (Get-ChildItem 'release/*.exe' -ErrorAction SilentlyContinue)) { $missing += 'release/*.exe' }
          if ($missing.Count -gt 0) {
            Write-Error "Missing release artifacts: $($missing -join ', ')"
            exit 1
          }
          Get-ChildItem -Path release -File | Select-Object Name, Length
      # Upload the artifacts to the GitHub Release for the pushed tag. electron-updater
      # on installed clients polls the release's latest.yml, so exactly these files
      # must land there: the installer, its blockmap, and latest.yml.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @()
          $assets += Get-ChildItem 'release/*.exe' -File | Select-Object -ExpandProperty FullName
          $assets += Get-ChildItem 'release/*.exe.blockmap' -File | Select-Object -ExpandProperty FullName
          $assets += 'release/latest.yml'
          gh release create "$env:GITHUB_REF_NAME" @assets `
            --title "$env:GITHUB_REF_NAME" `
            --notes "Whybase desktop release $env:GITHUB_REF_NAME" 2>&1 `
            || gh release upload "$env:GITHUB_REF_NAME" @assets --clobber
        shell: pwsh

